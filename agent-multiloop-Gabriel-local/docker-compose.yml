# ============================================================
# Multi-Loop Math Agent - docker-compose.yml
# Services : agent (multiloop), ollama, ollama-init, isabelle
# 
# v5.3 MISE A JOUR :
# ✓ methode_spectral.thy INCLUS dans l'image Docker
# ✓ Gabriel expose port 8000 pour communications externes
# ✓ Isabelle en mode CLI (batch) - integration avec Gabriel
# ✓ Support pour www.universestaucarre.com via reseau Docker
# ✓ Permet communication entre Gabriel local et version web
# ✓ VOLUMES EN READ-WRITE pour corrections dynamiques
# ✓ validation_hol_unifiee.thy AJOUTE
# ✓ PORT 8080 UTILISE (evite Docker Desktop backend sur 9000)
# ✓ Geometrie_du_Spectre PDF monté dans conteneur
# ✓ GABRIEL_LAUNCHER: gestion propre des signaux
# ============================================================

services:

  # ===========================================
  # SERVICE PRINCIPAL : llm-agent-multiloop
  # ===========================================
  llm-agent-multiloop:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: llm-agent-multiloop-run
    restart: "no"

    env_file:
      - .env

    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_LANGUAGE=fr
      - ISABELLE_HOME=/opt/Isabelle2025-2
      - GABRIEL_HTTP_PORT=9001
      - GABRIEL_HOST=0.0.0.0

    stdin_open: true
    tty: true

    ports:
      - "9001:8000"

    command: ["python", "main_cli.py"]

    volumes:
      - ./src:/home/agent/app/src
      - ./main.py:/home/agent/app/main.py
      - ./main_cli.py:/home/agent/app/main_cli.py
      - ./gabriel_launcher.py:/home/agent/app/gabriel_launcher.py
      - ./port_cleanup.py:/home/agent/app/port_cleanup.py
      - ./config.yaml:/home/agent/app/config.yaml
      - ./tests:/home/agent/app/tests
      - ./scripts:/home/agent/app/scripts

      # OVERRIDE : utiliser la version locale des fichiers .thy (READ-WRITE)
      - ./theories:/home/agent/app/theories

      - ./CONFIG_ENV_GUIDE.md:/home/agent/app/CONFIG_ENV_GUIDE.md
      - ./.github:/home/agent/app/.github
      - ./docker-compose.yml:/home/agent/app/docker-compose.yml
      - ./memory:/home/agent/app/memory
      - ./.env:/home/agent/app/.env
      - agent-data:/home/agent/app/data
      - agent-logs:/home/agent/app/logs
      - ${HOST_DEBAT_DIR:-./data/debats}:/home/agent/app/data/debats-onedrive

    networks:
      - agent-network

    depends_on:
      - ollama

  # ===========================================
  # SERVICE : OLLAMA
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - agent-network

  # ===========================================
  # SERVICE : OLLAMA INIT
  # ===========================================
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Attente du demarrage d Ollama...'
      sleep 30
      OLLAMA_HOST=http://ollama:11434 ollama pull llama3.2 || true
      echo 'Modeles telecharges.'
      "
    networks:
      - agent-network
    restart: "no"

  # ===========================================
  # SERVICE : ISABELLE/HOL
  # ===========================================
  isabelle:
    image: makarius/isabelle:latest
    container_name: isabelle
    restart: unless-stopped
    profiles: ["isabelle"]

    environment:
      - GABRIEL_HOST=llm-agent-multiloop
      - GABRIEL_PORT=8000
      - ISABELLE_BATCH_MODE=true

    volumes:
      - ./theories:/theories
      - ./scripts/isabelle-integration.sh:/scripts/isabelle-integration.sh
      - isabelle-heaps:/home/isabelle/.isabelle/heaps
      - isabelle-output:/tmp/isabelle-output

    working_dir: /theories

    networks:
      - agent-network

    depends_on:
      - llm-agent-multiloop

    entrypoint: ["/bin/bash"]
    command: ["-c", "exec /scripts/isabelle-integration.sh"]

# ===========================================
volumes:
  agent-data:
  agent-logs:
  ollama-data:
  isabelle-heaps:
  isabelle-output:

networks:
  agent-network:
    driver: bridge
