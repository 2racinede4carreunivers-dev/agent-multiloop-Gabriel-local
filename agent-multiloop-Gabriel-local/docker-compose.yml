# ============================================================
# Multi-Loop Math Agent - docker-compose.yml
# Services : agent (multiloop), ollama, ollama-init, isabelle
# 
# v5.3 CORRIGE :
# ✓ Ports cohérents (Gabriel interne 8000, externe 9001)
# ✓ .env non monté en double
# ✓ Volumes RW pour .thy
# ============================================================

services:

  llm-agent-multiloop:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: llm-agent-multiloop-run
    restart: "no"

    env_file:
      - .env

    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_LANGUAGE=fr
      - ISABELLE_HOME=/opt/Isabelle2025-2
      - GABRIEL_HTTP_PORT=8000
      - GABRIEL_HOST=0.0.0.0

    stdin_open: true
    tty: true

    ports:
      - "9001:8000"

    command: ["python", "main_cli.py"]

    volumes:
      - ./src:/home/agent/app/src
      - ./main.py:/home/agent/app/main.py
      - ./main_cli.py:/home/agent/app/main_cli.py
      - ./gabriel_launcher.py:/home/agent/app/gabriel_launcher.py
      - ./port_cleanup.py:/home/agent/app/port_cleanup.py
      - ./config.yaml:/home/agent/app/config.yaml
      - ./tests:/home/agent/app/tests
      - ./scripts:/home/agent/app/scripts
      - ./theories:/home/agent/app/theories
      - ./CONFIG_ENV_GUIDE.md:/home/agent/app/CONFIG_ENV_GUIDE.md
      - ./.github:/home/agent/app/.github
      - ./docker-compose.yml:/home/agent/app/docker-compose.yml
      - ./memory:/home/agent/app/memory
      - agent-data:/home/agent/app/data
      - agent-logs:/home/agent/app/logs
      - ${HOST_DEBAT_DIR:-./data/debats}:/home/agent/app/data/debats-onedrive

    networks:
      - agent-network

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - agent-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Attente du demarrage d Ollama...'
      sleep 30
      OLLAMA_HOST=http://ollama:11434 ollama pull llama3.2 || true
      echo 'Modeles telecharges.'
      "
    networks:
      - agent-network
    restart: "no"

  isabelle:
    image: makarius/isabelle:latest
    container_name: isabelle
    restart: unless-stopped
    profiles: ["isabelle"]

    environment:
      - GABRIEL_HOST=llm-agent-multiloop
      - GABRIEL_PORT=8000
      - ISABELLE_BATCH_MODE=true

    volumes:
      - ./theories:/theories
      - ./scripts/isabelle-integration.sh:/scripts/isabelle-integration.sh
      - isabelle-heaps:/home/isabelle/.isabelle/heaps
      - isabelle-output:/tmp/isabelle-output

    working_dir: /theories

    networks:
      - agent-network

    depends_on:
      - llm-agent-multiloop

    entrypoint: ["/bin/bash"]
    command: ["-c", "exec /scripts/isabelle-integration.sh"]

volumes:
  agent-data:
  agent-logs:
  ollama-data:
  isabelle-heaps:
  isabelle-output:

networks:
  agent-network:
    driver: bridge
